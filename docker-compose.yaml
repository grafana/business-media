services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    ports:
      - 3000:3000/tcp
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_USERS_DEFAULT_THEME: light
      GF_PLUGINS_PREINSTALL: marcusolsson-static-datasource,golioth-websocket-datasource,yesoreyeram-infinity-datasource
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles:
      - default

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - 5432:5432
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d
    profiles:
      - default
      - dev
      - main
      - playwright

  pdf-loader:
    build: ./postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - default
      - dev
      - main
      - playwright

  grafana-dev:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise-dev}
        grafana_version: ${GRAFANA_DEV_VERSION:-6711104e}
        development: "true"
    ports:
      - 3000:3000/tcp
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/panels.json
      GF_PLUGINS_PREINSTALL: marcusolsson-static-datasource,golioth-websocket-datasource,yesoreyeram-infinity-datasource
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles:
      - dev

  grafana-main:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      context: .config
      args:
        grafana_version: ${GRAFANA_VERSION:-main}
        development: "true"
    ports:
      - 3000:3000/tcp
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_USERS_DEFAULT_THEME: light
      GF_PLUGINS_PREINSTALL: marcusolsson-static-datasource,golioth-websocket-datasource,yesoreyeram-infinity-datasource
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles:
      - main

  playwright:
    build:
      context: .
      dockerfile: test/Dockerfile
    environment:
      - GRAFANA_URL=http://grafana:3000
    volumes:
      - ./test:/app/test
      - ./playwright-report:/app/playwright-report
    depends_on:
      grafana:
        condition: service_healthy
      pdf-loader:
        condition: service_completed_successfully
    profiles:
      - default
      - playwright
